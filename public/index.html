<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070a0f">
<title>Zipchair AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Zipchair brand (pulled from zipchair.com theme vars) */
  --brand-blue: #004a98;
  --brand-black: #121212;

  /* App theme (dark, premium, Zipchair energy) */
  --bg: #070a0f;
  --surface: #0e131c;
  --surface2: #121a26;
  --border: rgba(255,255,255,0.10);

  --text: rgba(255,255,255,0.92);
  --text2: rgba(255,255,255,0.62);

  --accent: var(--brand-blue);
  --accent2: #1b7bff;

  --glass: rgba(255,255,255,0.05);
  --glass2: rgba(255,255,255,0.09);
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Rubik', system-ui, -apple-system, Segoe UI, sans-serif;
  background: radial-gradient(1200px 800px at 20% -10%, rgba(0,74,152,0.35), transparent 55%),
              radial-gradient(900px 700px at 110% 10%, rgba(27,123,255,0.22), transparent 60%),
              var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
}

/* Header */
.header {
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: linear-gradient(180deg, rgba(0,74,152,0.22) 0%, rgba(0,0,0,0) 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 44px;
  height: 44px;
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(0,74,152,0.9), rgba(27,123,255,0.85));
  border: 1px solid rgba(255,255,255,0.14);
  box-shadow: 0 14px 50px rgba(0,74,152,0.25);
  display: grid;
  place-items: center;
  overflow: hidden;
}
.logo-mark img { width: 26px; height: 26px; object-fit: contain; filter: drop-shadow(0 6px 16px rgba(0,0,0,0.45)); }
.logo-text { font-size: 18px; font-weight: 800; letter-spacing: -0.4px; }
.logo-text span { color: #ffffff; }
.header-badge {
  margin-left: auto;
  font-size: 11px;
  color: var(--text2);
  background: rgba(255,255,255,0.06);
  padding: 6px 10px;
  border-radius: 999px;
  border: 1px solid rgba(255,255,255,0.12);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.header-badge::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  background: #22c55e;
  border-radius: 50%;
  vertical-align: middle;
}
.header-badge.loading::before { background: #f59e0b; }
.header-badge.error::before { background: #ef4444; }

/* Chat area */
.chat-area {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px;
  scroll-behavior: smooth;
}
.chat-area::-webkit-scrollbar { width: 4px; }
.chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

/* Messages */
.msg { display: flex; gap: 10px; max-width: 85%; animation: msgIn 0.4s cubic-bezier(0.16,1,0.3,1); }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg-avatar {
  width: 34px;
  height: 34px;
  border-radius: 12px;
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(0,74,152,0.9), rgba(27,123,255,0.85));
  border: 1px solid rgba(255,255,255,0.14);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: -0.2px;
  margin-top: 2px;
  color: #fff;
}
.msg-avatar img { width: 18px; height: 18px; object-fit: contain; }
.msg.user .msg-avatar {
  background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
  color: rgba(255,255,255,0.9);
}
.msg-bubble {
  padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.6;
  background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  border: 1px solid var(--border);
}
.msg.user .msg-bubble {
  background: linear-gradient(135deg, rgba(0,74,152,0.18), rgba(27,123,255,0.10));
  border-color: rgba(27,123,255,0.22);
}
.msg-bubble strong { color: rgba(255,255,255,0.96); font-weight: 700; }
.msg-bubble a { color: rgba(255,255,255,0.96); }

/* Product cards */
.products-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px; margin-top: 12px;
}
.product-card {
  background: var(--surface2); border-radius: 14px; overflow: hidden;
  border: 1px solid var(--border); transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
  cursor: pointer;
}
.product-card:hover { border-color: rgba(27,123,255,0.7); transform: translateY(-4px); box-shadow: 0 16px 50px rgba(0,74,152,0.25); }
.product-card { position: relative; }
.product-card img {
  width: 100%; aspect-ratio: 1; object-fit: cover;
  background: #1e1e1e;
}
.sale-badge {
  position: absolute; top: 10px; right: 10px;
  background: linear-gradient(135deg, #dc2626, #ef4444);
  color: white; font-size: 10px; font-weight: 800;
  padding: 4px 8px; border-radius: 6px;
  letter-spacing: 0.5px; z-index: 2;
  box-shadow: 0 4px 12px rgba(220,38,38,0.4);
}
.show-more-btn {
  display: block; width: 100%; margin-top: 12px; padding: 12px;
  border: 1px solid var(--border); border-radius: 12px;
  background: var(--glass2); color: var(--accent2); font-size: 13px;
  font-weight: 600; cursor: pointer; font-family: inherit;
  transition: all 0.2s;
}
.show-more-btn:hover { border-color: rgba(27,123,255,0.7); background: rgba(27,123,255,0.1); }
.product-info { padding: 12px; }
.product-title { font-size: 12px; font-weight: 500; line-height: 1.4; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.product-price { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.product-price .current { font-size: 16px; font-weight: 700; color: var(--accent); }
.product-price .compare { font-size: 12px; color: var(--text2); text-decoration: line-through; }
.product-btn {
  display: block;
  width: 100%;
  padding: 9px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(0,74,152,0.95), rgba(27,123,255,0.90));
  color: white;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  transition: opacity 0.2s;
}
.product-btn:hover { opacity: 0.85; }

/* Typing indicator */
.typing { display: flex; gap: 10px; align-items: flex-start; }
.typing .msg-avatar { animation: pulse 1.5s ease infinite; }
.typing-dots { display: flex; gap: 4px; padding: 16px; background: var(--glass); border-radius: 16px; border: 1px solid var(--border); }
.typing-dots span {
  width: 8px; height: 8px; border-radius: 50%; background: var(--text2);
  animation: bounce 1.4s ease infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.16s; }
.typing-dots span:nth-child(3) { animation-delay: 0.32s; }

/* Input */
.input-area {
  padding: 16px 20px; border-top: 1px solid var(--border); flex-shrink: 0;
  background: linear-gradient(0deg, var(--bg) 50%, transparent);
}
.input-wrap {
  display: flex; gap: 10px; max-width: 800px; margin: 0 auto;
}
.input-wrap input {
  flex: 1; padding: 14px 18px; border-radius: 14px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text); font-size: 14px; font-family: inherit;
  outline: none; transition: border-color 0.2s;
}
.input-wrap input:focus { border-color: var(--accent); }
.input-wrap input::placeholder { color: var(--text2); }
.send-btn {
  width: 48px;
  height: 48px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.14);
  background: linear-gradient(135deg, rgba(0,74,152,0.95), rgba(27,123,255,0.90));
  color: white;
  font-size: 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
  box-shadow: 0 18px 60px rgba(0,74,152,0.20);
}
.send-btn:hover { transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* Quick replies */
.quick-replies { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.quick-reply {
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--glass2); color: var(--text); font-size: 12px;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.quick-reply:hover { border-color: rgba(27,123,255,0.85); color: rgba(255,255,255,0.95); }

/* Animations */
@keyframes msgIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes bounce {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-6px); }
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* Responsive */
@media (max-width: 600px) {
  .msg { max-width: 95%; }
  .products-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .header { padding: 12px 16px; }
  .chat-area { padding: 16px; }
  .input-area { padding: 12px 16px; }
  .header-badge { display: none; }
}

/* Powered by */
.powered { text-align: center; font-size: 10px; color: var(--text2); padding: 8px 0 4px; }
.powered a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-mark">
      <img src="/zipchair-icon.png" alt="Zipchair" />
    </div>
    <div>
      <div class="logo-text">Zipchair <span>AI Assistant</span></div>
    </div>
  </div>
  <div class="header-badge loading" id="statusBadge">Loading catalog…</div>
</div>

<div class="chat-area" id="chatArea"></div>

<div class="input-area">
  <div class="input-wrap">
    <input type="text" id="chatInput" placeholder="Ask about teams, chairs, or say hi..." autocomplete="off" enterkeyhint="send" disabled>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
  </div>
  <div class="powered">Powered by <a href="https://www.zipchair.com" target="_blank" rel="noreferrer">Zipchair</a></div>
</div>

<script>
const chatArea = document.getElementById('chatArea');
const chatInput = document.getElementById('chatInput');
const sendBtn = document.getElementById('sendBtn');
const statusBadge = document.getElementById('statusBadge');

let history = [];

// ===== Catalog + chat logic (ported from server.js; fully client-side) =====
let products = [];
let teamIndex = {};

// Common team aliases
const TEAM_ALIASES = {
  'niners': 'san francisco 49ers', '49ers': 'san francisco 49ers', 'sf 49ers': 'san francisco 49ers',
  'pats': 'new england patriots', 'patriots': 'new england patriots',
  'hawks': 'seattle seahawks', 'seahawks': 'seattle seahawks',
  'pack': 'green bay packers', 'packers': 'green bay packers',
  'boys': 'dallas cowboys', 'cowboys': 'dallas cowboys',
  'bucs': 'tampa bay buccaneers', 'buccaneers': 'tampa bay buccaneers',
  'chiefs': 'kansas city chiefs',
  'bills': 'buffalo bills',
  'eagles': 'philadelphia eagles',
  'steelers': 'pittsburgh steelers',
  'bears': 'chicago bears',
  'lions': 'detroit lions',
  'ravens': 'baltimore ravens',
  'broncos': 'denver broncos',
  'chargers': 'los angeles chargers',
  'rams': 'los angeles rams',
  'raiders': 'las vegas raiders',
  'dolphins': 'miami dolphins',
  'jets': 'new york jets',
  'giants': 'new york giants',
  'bengals': 'cincinnati bengals',
  'browns': 'cleveland browns',
  'texans': 'houston texans',
  'colts': 'indianapolis colts',
  'jaguars': 'jacksonville jaguars', 'jags': 'jacksonville jaguars',
  'titans': 'tennessee titans',
  'saints': 'new orleans saints',
  'falcons': 'atlanta falcons',
  'panthers': 'carolina panthers',
  'vikings': 'minnesota vikings',
  'commanders': 'washington commanders',
  'cardinals': 'arizona cardinals',
  'yankees': 'new york yankees',
  'red sox': 'boston red sox', 'sox': 'boston red sox',
  'dodgers': 'los angeles dodgers',
  'cubs': 'chicago cubs',
  'mets': 'new york mets',
  'braves': 'atlanta braves',
  'astros': 'houston astros',
  'phillies': 'philadelphia phillies',
  'padres': 'san diego padres',
  'rangers': 'texas rangers',
  'guardians': 'cleveland guardians',
  'orioles': 'baltimore orioles',
  'twins': 'minnesota twins',
  'brewers': 'milwaukee brewers',
  'reds': 'cincinnati reds',
  'mariners': 'seattle mariners',
  'royals': 'kansas city royals',
  'blue jays': 'toronto blue jays',
  'white sox': 'chicago white sox',
  'pirates': 'pittsburgh pirates',
  'marlins': 'miami marlins',
  'nationals': 'washington nationals',
  'diamondbacks': 'arizona diamondbacks', 'dbacks': 'arizona diamondbacks',
  'rockies': 'colorado rockies',
  'angels': 'los angeles angels',
  'athletics': 'oakland athletics', 'a\'s': 'oakland athletics',
  'tigers': 'detroit tigers',
  'rays': 'tampa bay rays',
  'bruins': 'boston bruins',
  'blackhawks': 'chicago blackhawks',
  'penguins': 'pittsburgh penguins', 'pens': 'pittsburgh penguins',
  'maple leafs': 'toronto maple leafs', 'leafs': 'toronto maple leafs',
  'canadiens': 'montreal canadiens', 'habs': 'montreal canadiens',
  'red wings': 'detroit red wings',
  'flyers': 'philadelphia flyers',
  'oilers': 'edmonton oilers',
  'avalanche': 'colorado avalanche', 'avs': 'colorado avalanche',
  'hurricanes': 'carolina hurricanes', 'canes': 'carolina hurricanes',
  'lightning': 'tampa bay lightning', 'bolts': 'tampa bay lightning',
  'wild': 'minnesota wild',
  'predators': 'nashville predators', 'preds': 'nashville predators',
  'flames': 'calgary flames',
  'canucks': 'vancouver canucks',
  'islanders': 'new york islanders', 'isles': 'new york islanders',
  'blue jackets': 'columbus blue jackets',
  'sabres': 'buffalo sabres',
  'senators': 'ottawa senators', 'sens': 'ottawa senators',
  'sharks': 'san jose sharks',
  'blues': 'st. louis blues',
  'kraken': 'seattle kraken',
  'golden knights': 'vegas golden knights', 'knights': 'vegas golden knights',
  'coyotes': 'arizona coyotes',
  'jets hockey': 'winnipeg jets',
  'kings': 'los angeles kings',
  'ducks': 'anaheim ducks',
  'devils': 'new jersey devils',
  'panthers hockey': 'florida panthers',
  'stars': 'dallas stars',
  'aew': 'aew',
};

// Chair type keywords
const TYPE_KEYWORDS = {
  'office': ['office', 'xpression', 'task'],
  'gaming': ['gaming', 'phantomx', 'phantom', 'synergy', 'xpression pro'],
  'recliner': ['recliner', 'relax', 'rocker', 'freedom', 'stealth'],
  'bar stool': ['bar stool', 'bar', 'stool'],
  'home theater': ['home theater', 'theater', 'suitemax', 'suite'],
  'sofa': ['sofa', 'dyno sofa'],
  'loveseat': ['loveseat', 'dyno loveseat'],
  'club chair': ['club chair', 'dyno club'],
  'logo panel': ['logo panel', 'panel', 'logo'],
};

function buildTeamIndex() {
  teamIndex = {};
  products.forEach(p => {
    (p.tags || []).forEach(tag => {
      const key = String(tag).toLowerCase();
      if (!teamIndex[key]) teamIndex[key] = [];
      teamIndex[key].push(p);
    });
  });
}

function findTeam(msg) {
  const lower = String(msg || '').toLowerCase();
  // Check aliases first
  for (const [alias, full] of Object.entries(TEAM_ALIASES)) {
    if (lower.includes(alias)) return full;
  }
  // Check all tags, excluding generic groups
  const allTeamTags = Object.keys(teamIndex).filter(t => {
    const l = t.toLowerCase();
    return ![
      'small-package','ltl','wg','office chairs','gaming chairs','recliners','bar stools',
      'stationary collections','rocker recliner','relax recliner','synergy pro','phantomx',
      'xpression pro','stealth recliner','logo panels'
    ].some(g => l === g.toLowerCase());
  });
  for (const tag of allTeamTags) {
    if (lower.includes(tag.toLowerCase())) return tag.toLowerCase();
  }
  return null;
}

function findType(msg) {
  const lower = String(msg || '').toLowerCase();
  for (const [type, keywords] of Object.entries(TYPE_KEYWORDS)) {
    for (const kw of keywords) {
      if (lower.includes(kw)) return type;
    }
  }
  return null;
}

function findMultipleTypes(msg) {
  const lower = String(msg || '').toLowerCase();
  const found = [];
  for (const [type, keywords] of Object.entries(TYPE_KEYWORDS)) {
    if (keywords.some(kw => lower.includes(kw))) found.push(type);
  }
  return found.length > 0 ? found : null;
}

function extractMaxPrice(msg) {
  const lower = String(msg || '').toLowerCase();
  const m = lower.match(/under\s*\$?\s*(\d+)/);
  if (m) return parseInt(m[1], 10);
  const m2 = lower.match(/budget\s*(?:of|around|is)?\s*\$?\s*(\d+)/);
  if (m2) return parseInt(m2[1], 10);
  if (lower.includes('cheap') || lower.includes('affordable')) return 500;
  return null;
}

function applyPriceFilter(results, maxPrice) {
  if (!maxPrice) return results;
  return results.filter(p => p.price_min && p.price_min <= maxPrice);
}

function filterProducts(team, type) {
  let results = products;
  if (team) {
    const teamLower = String(team).toLowerCase();
    results = results.filter(p =>
      (p.tags || []).some(t => String(t).toLowerCase().includes(teamLower)) ||
      String(p.title || '').toLowerCase().includes(teamLower)
    );
  }
  if (type) {
    const keywords = TYPE_KEYWORDS[type] || [type];
    results = results.filter(p => {
      const searchStr = (String(p.title || '') + ' ' + (p.tags || []).join(' ') + ' ' + String(p.product_type || '')).toLowerCase();
      return keywords.some(kw => searchStr.includes(kw));
    });
  }
  return results;
}

function getAvailableTypes(team) {
  const teamProducts = filterProducts(team, null);
  const types = new Set();
  teamProducts.forEach(p => {
    const searchStr = (String(p.title || '') + ' ' + (p.tags || []).join(' ') + ' ' + String(p.product_type || '')).toLowerCase();
    for (const [type, keywords] of Object.entries(TYPE_KEYWORDS)) {
      if (keywords.some(kw => searchStr.includes(kw))) types.add(type);
    }
  });
  return [...types];
}

function handleChat(message, history) {
  const lower = String(message || '').toLowerCase().trim();
  const team = findTeam(message);
  const types = findMultipleTypes(message);
  const type = types ? types[0] : null;
  const maxPrice = extractMaxPrice(message);

  // "show more" pagination
  if (lower.match(/^(show more|more|next|see more)/)) {
    const page = (history || []).filter(h => h && h._page).length;
    // Pull context from history
    let cTeam = null, cType = null, cPrice = null;
    for (let i = (history || []).length - 1; i >= 0; i--) {
      const h = history[i] || {};
      if (!cTeam) cTeam = findTeam(h.content || '');
      if (!cType) {
        const t = findType(h.content || '');
        if (t) cType = t;
      }
      if (!cPrice) cPrice = extractMaxPrice(h.content || '');
    }
    let results = filterProducts(cTeam, cType);
    results = applyPriceFilter(results, cPrice);
    const offset = 6 * (page + 1);
    const batch = results.slice(offset, offset + 6);
    const remaining = results.length - offset - batch.length;
    return {
      response: batch.length > 0
        ? `Here are more results${cTeam ? ' for **' + cTeam + '**' : ''}:`
        : `That's everything I have${cTeam ? ' for ' + cTeam : ''}! Want to try a different search?`,
      products: batch,
      totalCount: results.length,
      hasMore: remaining > 0,
      remaining
    };
  }

  // Check history for context
  let contextTeam = team;
  let contextType = type;
  let fromHistory = false;
  if (history && history.length > 0) {
    for (let i = history.length - 1; i >= 0; i--) {
      const h = history[i] || {};
      if (!contextTeam) {
        const ht = findTeam(h.content || '');
        if (ht) { contextTeam = ht; fromHistory = true; }
      }
      if (!contextType) {
        const tt = findType(h.content || '');
        if (tt) contextType = tt;
      }
    }
  }

  const contextPrefix = (fromHistory && !team && contextTeam)
    ? `Still looking at **${contextTeam}** gear — ` : '';

  // Greeting
  if (lower.match(/^(hi|hey|hello|sup|yo|what'?s up|howdy)/)) {
    return {
      response: "Welcome to Zipchair. I can help you find the right chair with your favorite logo. We've got office chairs, gaming chairs, recliners, bar stools, home theater seating, and more — all with officially licensed logos.\n\nWhat team are you a fan of?",
      products: []
    };
  }

  // XZipit explanation
  if (lower.includes('xzipit') || lower.includes('swap') || lower.includes('change logo') || lower.includes('switch logo')) {
    return {
      response: "Great question! 🔄 **XZipit** is ZipChair's patented logo panel system. Here's how it works:\n\n• Every ZipChair product has a removable logo panel\n• You can swap logos in seconds — no tools needed\n• Buy additional logo panels ($119.99+) for different teams\n• One chair, endless possibilities!\n\nSo if you're a fan of multiple teams, or your allegiance changes (hey, it happens 😄), you just swap the panel. Want to see some logo panels?",
      products: []
    };
  }

  // Multi-type request ("recliner and bar stools")
  if (types && types.length > 1 && contextTeam) {
    let allProducts = [];
    let responseParts = [];
    types.forEach(t => {
      let results = filterProducts(contextTeam, t);
      results = applyPriceFilter(results, maxPrice);
      const total = results.length;
      const batch = results.slice(0, 3);
      allProducts.push(...batch);
      responseParts.push(`**${t}** (${total} available)`);
    });
    const priceNote = maxPrice ? ` under $${maxPrice}` : '';
    return {
      response: `${contextPrefix}Here's what we have for **${contextTeam}**${priceNote}! Found ${responseParts.join(' and ')}:`,
      products: allProducts,
      totalCount: allProducts.length,
      hasMore: false
    };
  }

  // "What do you have" / browse
  if (lower.match(/(what do you|what've you|show me|browse|catalog|all products|what.*have)/)) {
    if (contextTeam) {
      let results = filterProducts(contextTeam, null);
      results = applyPriceFilter(results, maxPrice);
      const total = results.length;
      const typesAvail = getAvailableTypes(contextTeam);
      return {
        response: `${contextPrefix}Here's what we have for **${contextTeam}**! ${total} products across ${typesAvail.join(', ')} and more. Here are some highlights:`,
        products: results.slice(0, 6),
        totalCount: total,
        hasMore: total > 6,
        remaining: Math.max(0, total - 6)
      };
    }
    return {
      response: "We've got a massive selection! 🏟️ To narrow it down, tell me:\n\n🏈 **Your team** — NFL, MLB, NHL, AEW, NCAA, MLS\n🪑 **Chair type** — Office, Gaming, Recliner, Bar Stool, Home Theater, Sofa, Loveseat\n💰 **Budget** — We have options from $119 to $3,000+\n\nWhat team are you looking for?",
      products: []
    };
  }

  // How much / pricing
  if (lower.match(/(how much|price|cost|pricing)/)) {
    if (contextTeam) {
      let results = filterProducts(contextTeam, contextType);
      results = applyPriceFilter(results, maxPrice);
      const total = results.length;
      return {
        response: `${contextPrefix}Here are the prices for ${contextTeam}${contextType ? ' ' + contextType + 's' : ''} (${total} products):`,
        products: results.slice(0, 6),
        totalCount: total,
        hasMore: total > 6,
        remaining: Math.max(0, total - 6)
      };
    }
    return {
      response: "Our pricing ranges depend on the product type:\n\n• **Logo Panels** — from $119.99\n• **Office Chairs** — from $349.99\n• **Gaming Chairs** — from $399.99\n• **Bar Stools** — from $349.99\n• **Recliners** — from $849.99\n• **Home Theater** — from $849.99\n• **Sofas & Loveseats** — from $719.99\n• **VIP Seating (SuiteMax)** — from $1,649.99\n\nWhat team and style are you interested in?",
      products: []
    };
  }

  // Compare
  if (lower.includes('compare') || lower.includes('difference') || lower.includes('vs')) {
    return {
      response: "Here's a quick comparison of our chair types:\n\n🖥️ **Office/Task Chairs** — Ergonomic desk chairs, great for work-from-home\n🎮 **Gaming Chairs** — Racing-style or mesh, built for long sessions\n📺 **Recliners** — Full reclining comfort for your man cave\n🍺 **Bar Stools** — Perfect for your home bar or kitchen counter\n🎬 **Home Theater** — VIP cinema-style seating\n🛋️ **Sofas & Loveseats** — Full living room furniture with team logos\n\nAll products use the **XZipit** system so you can swap logos anytime! What type interests you?",
      products: []
    };
  }

  // Team + type + optional price (the unified path)
  if (contextTeam && (type || maxPrice)) {
    let results = filterProducts(contextTeam, type || contextType);
    results = applyPriceFilter(results, maxPrice);
    const total = results.length;
    if (results.length === 0) {
      const priceNote = maxPrice ? ` under $${maxPrice}` : '';
      const typeNote = type ? ` ${type}` : '';
      return {
        response: `${contextPrefix}I couldn't find${typeNote} products for **${contextTeam}**${priceNote}. Want to try a higher budget or different type?`,
        products: []
      };
    }
    const priceNote = maxPrice ? ` under $${maxPrice}` : '';
    const typeNote = type ? `**${type}** ` : '';
    return {
      response: `${contextPrefix}Found **${total}** ${typeNote}products for **${contextTeam}**${priceNote}! 🪑`,
      products: results.slice(0, 6),
      totalCount: total,
      hasMore: total > 6,
      remaining: Math.max(0, total - 6)
    };
  }

  // Team found, no type
  if (team && !type) {
    let results = filterProducts(team, null);
    results = applyPriceFilter(results, maxPrice);
    const total = results.length;
    const availTypes = getAvailableTypes(team);
    if (total === 0) {
      return {
        response: `Hmm, I couldn't find products specifically tagged "${team}". Try the full team name (e.g., "Dallas Cowboys" or "New York Yankees"). What team are you looking for?`,
        products: []
      };
    }
    const priceNote = maxPrice ? ` under $${maxPrice}` : '';
    return {
      response: `Great choice! 🎉 We have **${total}** products for **${team}**${priceNote}!\n\nAvailable types: ${availTypes.map(t => `**${t}**`).join(', ')}\n\nWhat type of furniture are you looking for? Or here are some highlights:`,
      products: results.slice(0, 6),
      totalCount: total,
      hasMore: total > 6,
      remaining: Math.max(0, total - 6)
    };
  }

  // Type found without team
  if (type) {
    let results = filterProducts(null, type);
    results = applyPriceFilter(results, maxPrice);
    const total = results.length;
    const priceNote = maxPrice ? ` under $${maxPrice}` : '';
    return {
      response: `Here are our **${type}** options${priceNote}! 🪑 (${total} products)`,
      products: results.slice(0, 6),
      totalCount: total,
      hasMore: total > 6,
      remaining: Math.max(0, total - 6)
    };
  }

  // Yes/sure/ok type responses
  if (lower.match(/^(yes|yeah|yep|sure|ok|okay|yea|absolutely|definitely)$/)) {
    if (contextTeam) {
      let results = filterProducts(contextTeam, null);
      const total = results.length;
      return {
        response: `Here's more from our ${contextTeam} collection:`,
        products: results.slice(0, 6),
        totalCount: total,
        hasMore: total > 6,
        remaining: Math.max(0, total - 6)
      };
    }
    return {
      response: "Awesome! What team are you a fan of? 🏟️",
      products: []
    };
  }

  // Thanks
  if (lower.match(/(thanks|thank you|thx|ty)/)) {
    return {
      response: "You're welcome! 😊 Let me know if you need anything else. Happy shopping! 🪑🏆",
      products: []
    };
  }

  // Fallback — try to find any matching products
  let fallbackResults = products.filter(p => {
    const searchStr = (String(p.title || '') + ' ' + (p.tags || []).join(' ') + ' ' + String(p.product_type || '') + ' ' + String(p.description || '')).toLowerCase();
    return lower.split(/\s+/).some(word => word.length > 3 && searchStr.includes(word));
  });
  fallbackResults = applyPriceFilter(fallbackResults, maxPrice);

  if (fallbackResults.length > 0) {
    const total = fallbackResults.length;
    return {
      response: `Here's what I found (${total} products):`,
      products: fallbackResults.slice(0, 6),
      totalCount: total,
      hasMore: total > 6,
      remaining: Math.max(0, total - 6)
    };
  }

  return {
    response: "I'd love to help you find the perfect ZipChair! 🪑\n\nTry telling me:\n• A **team name** (e.g., \"Cowboys\", \"Yankees\", \"Bruins\")\n• A **product type** (e.g., \"gaming chair\", \"recliner\", \"bar stool\")\n• A **budget** (e.g., \"under $500\")\n\nWhat are you looking for?",
    products: []
  };
}

async function loadCatalog() {
  statusBadge.classList.add('loading');
  statusBadge.classList.remove('error');
  statusBadge.textContent = 'Loading catalog…';

  try {
    const r = await fetch('/data/products.json', { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    products = await r.json();
    buildTeamIndex();

    statusBadge.classList.remove('loading');
    statusBadge.textContent = `Catalog ready · ${products.length.toLocaleString()} products`;

    chatInput.disabled = false;
    sendBtn.disabled = false;

    // Initial greeting once we can actually answer product questions
    addMessage('assistant', "Welcome to Zipchair. I can help you find the right chair with your favorite logo.\n\nWe carry **NFL, MLB, NHL, AEW, NCAA** and more — office chairs, gaming chairs, recliners, bar stools, home theater seating, sofas, and loveseats.\n\nWhat team are you a fan of?");
    setTimeout(showQuickReplies, 300);

    chatInput.focus();
  } catch (e) {
    console.error(e);
    statusBadge.classList.remove('loading');
    statusBadge.classList.add('error');
    statusBadge.textContent = 'Catalog failed to load';
    addMessage('assistant', "I couldn't load the product catalog. If you're opening this as a local file (file://), the browser may block fetch().\n\nTry running a local static server (e.g. `npx serve public`) or deploy to Vercel.");
  }
}

// ===== UI helpers =====
function formatText(text) {
  return String(text || '')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function renderProducts(products, hasMore, remaining) {
  if (!products || products.length === 0) return '';
  let html = '<div class="products-grid">';
  products.forEach(p => {
    const img = p.image ? String(p.image).replace(/\.jpg|\.png/, '_400x.jpg') : '';
    const compare = p.compare_at_price_min && p.compare_at_price_min > p.price_min
      ? `<span class="compare">$${Number(p.compare_at_price_min).toFixed(2)}</span>` : '';
    const saleBadge = (p.compare_at_price_min && p.compare_at_price_min > p.price_min)
      ? '<div class="sale-badge">SALE</div>' : '';
    html += `
      <div class="product-card" onclick="window.open('https://www.zipchair.com/products/${p.handle}','_blank')">
        ${saleBadge}
        ${img ? `<img src="${img}" alt="${p.title}" loading="lazy" onerror="this.style.display='none'">` : ''}
        <div class="product-info">
          <div class="product-title">${p.title}</div>
          <div class="product-price">
            <span class="current">$${Number(p.price_min).toFixed(2)}</span>
            ${compare}
          </div>
          <a class="product-btn" href="https://www.zipchair.com/products/${p.handle}" target="_blank" onclick="event.stopPropagation()">View Product →</a>
        </div>
      </div>`;
  });
  html += '</div>';
  if (hasMore && remaining > 0) {
    html += `<button class="show-more-btn" onclick="sendMessage('show more')">Show ${remaining} more products →</button>`;
  }
  return html;
}

function addMessage(role, text, products, hasMore, remaining) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const avatar = role === 'user'
    ? '<span>You</span>'
    : '<img src="/zipchair-icon.png" alt="Zipchair">';
  div.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-bubble">${formatText(text)}</div>
      ${renderProducts(products, hasMore, remaining)}
    </div>`;
  chatArea.appendChild(div);
  requestAnimationFrame(() => { chatArea.scrollTop = chatArea.scrollHeight; });
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing';
  div.id = 'typingIndicator';
  div.innerHTML = `
    <div class="msg-avatar"><img src="/zipchair-icon.png" alt="Zipchair"></div>
    <div class="typing-dots"><span></span><span></span><span></span></div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typingIndicator');
  if (el) el.remove();
}

async function sendMessage(text) {
  const msg = text || chatInput.value.trim();
  if (!msg) return;
  if (!products || products.length === 0) {
    addMessage('assistant', 'Still loading the catalog — try again in a moment.');
    return;
  }

  chatInput.value = '';
  sendBtn.disabled = true;

  addMessage('user', msg);
  history.push({ role: 'user', content: msg });

  showTyping();

  // Simulate natural delay
  const delay = 600 + Math.random() * 800;

  try {
    const data = handleChat(msg, history);

    await new Promise(r => setTimeout(r, delay));
    hideTyping();

    addMessage('assistant', data.response, data.products, data.hasMore, data.remaining);

    const isShowMore = String(msg).toLowerCase().trim().match(/^(show more|more|next|see more)/);
    history.push({ role: 'assistant', content: data.response, _page: !!isShowMore });
  } catch (e) {
    console.error(e);
    await new Promise(r => setTimeout(r, delay));
    hideTyping();
    addMessage('assistant', "Oops, something went wrong.");
  }

  sendBtn.disabled = false;
  chatInput.focus();
}

chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Quick replies
function showQuickReplies() {
  const teams = ['Dallas Cowboys', 'New York Yankees', 'Chicago Bears', 'Boston Bruins', 'AEW'];
  const div = document.createElement('div');
  div.className = 'quick-replies';
  div.style.animation = 'msgIn 0.4s cubic-bezier(0.16,1,0.3,1)';
  teams.forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = t;
    btn.onclick = () => { div.remove(); sendMessage(t); };
    div.appendChild(btn);
  });
  ['Gaming Chairs', 'Under $500', 'What is XZipit?'].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'quick-reply';
    btn.textContent = t;
    btn.onclick = () => { div.remove(); sendMessage(t); };
    div.appendChild(btn);
  });
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
}

// Init
loadCatalog();
</script>

</html>
